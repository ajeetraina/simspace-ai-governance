  # Agent binaries open a session. Per the spec, `claude -p "<prompt>"` (and
  # `codex -p ...`) runs ONE agent turn against the agent scenarios above
  # (matched by promptContains) and exits without entering the REPL - which is
  # how every `claude -p "..."` block in the lab is dispatched and content-routed.
  - id: claude-session
    when:
      command: [claude]
    then:
      session:
        prompt: "claude> "
        intro:
          - "Claude Code ready. Enter a task, or type /exit to leave."
        outro:
