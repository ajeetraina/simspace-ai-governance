version: "2.0"

metadata:
  id: ai-governance
  title: "Docker AI Governance"
  summary: >
    Define once, enforce everywhere. Prove how org AI Governance policies stop a
    rogue agent's network, filesystem, credential, and MCP attacks - all simulated.

# In-memory state. Scenarios read it in `when.state` and write it in `then.state`.
# The `governance.active`, `policy.denyExfil`, and `policy.denyCreds` flags are
# also wired to Settings-dialog toggles (see `controls:` below) so a learner can
# flip a policy off and watch enforcement disappear.
state:
  governance:
    active: true # org AI Governance policy is in effect and synced to this machine
  policy:
    denyExfil: true # network rule: deny exfiltration (paste.ee, pastebin, slack hooks)
    denyCreds: true # filesystem rule: deny credentials (~/.ssh, ~/.aws, ~/.docker)
  secret:
    anthropic: false # a provider key stored in the OS keychain
  sandbox:
    inside: false # are we currently at a shell prompt inside a running sandbox?
  mcp:
    enabled: false # SBX_MCP_URL exported → `sbx mcp` subtree unlocked
    hasServers: false # at least one server registered
    attached: "" # server attached to the current agent run
  catalog:
    cloned: false
    fixed: false

settings:
  pace:
    pull: 700 # simulated image pull
    build: 900 # simulated build step
    scan: 1200 # simulated Scout vulnerability analysis
    sync: 600 # simulated policy sync
    boot: 800 # simulated microVM boot

defaults:
  unmatched:
    stderr: ["command not found - this command isn't part of the lab."]
    exit: 1

# Settings-dialog toggles (the gear next to Reset). These are the in-lab analog of
# the switches an admin flips in app.docker.com → AI governance. Turn one OFF, then
# re-run the demos to watch enforcement disappear.
controls:
  - id: governance
    label: "AI Governance — enforced by your org"
    description: "The master switch. Off = no org policy synced (like an ungoverned laptop)."
    state: governance.active
    enabled: true
    disabled: false
  - id: deny-exfiltration
    label: "Network rule: deny exfiltration"
    description: "Blocks paste.ee, pastebin.com, hooks.slack.com. Off = the paste site is reachable."
    state: policy.denyExfil
    enabled: true
    disabled: false
  - id: deny-credentials
    label: "Filesystem rule: deny credentials"
    description: "Blocks mounting ~/.ssh, ~/.aws, ~/.docker. Off = the sandbox can mount your keys."
    state: policy.denyCreds
    enabled: true
    disabled: false

scenarios:
  # ===========================================================================
  # Environment: versions, login
  # ===========================================================================
  - id: sbx-version
    when:
      command: [sbx, version]
    then:
      output: ["sbx version: v0.38.0-rc1-57-gde89a8dd6 de89a8dd67fc899f48b3d547b4790021918de7e2"]

  - id: sbx-login
    when:
      command: [sbx, login]
    then:
      state: { governance.active: true }
      output:
        - "Opening your browser to authenticate with Docker..."
        - { text: "Login Succeeded", delay: sync }
        - "Synced AI Governance policy for $$org$$ (cached locally)."

  - id: sbx-logout
    when:
      command: [sbx, logout]
    then:
      output: ["Logged out."]

  - id: docker-login
    when:
      command: [docker, login]
    then:
      output:
        - "Authenticating with existing credentials..."
        - "Login Succeeded"

  - id: git-version
    when:
      command: [git]
      args: { --version: { any: true } }
    then:
      output: ["git version 2.51.0"]

  # ===========================================================================
  # Section 1 - The Problem Statement: ask the agent to find your secrets.
  # `claude -p "...credentials..."` routes the prompt text to these agent
  # scenarios; the result depends on whether we're inside a sandbox yet.
  # ===========================================================================
  # Inside a sandbox the search comes up empty (secrets were never mounted).
  - id: agent-find-secrets-inside
    when:
      agent: true
      promptContains: [credentials]
      state: { sandbox.inside: true }
    then:
      output:
        - "● Searching the filesystem I can see..."
        - "I came up empty:"
        - "  ~/.ssh        → not present in this sandbox"
        - "  ~/.aws        → not present in this sandbox"
        - "  ~/.docker     → not present in this sandbox"
        - "Only the mounted workspace exists here - there are no host credentials to find."

  # On the host, with no sandbox, the agent reads everything.
  - id: agent-find-secrets-host
    when:
      agent: true
      promptContains: [credentials]
    then:
      output:
        - "● Searching ~/.aws, ~/.ssh, ~/.docker, ~/.config/gcloud, and *.env ..."
        - "Found credentials in several locations:"
        - "  ~/.aws/credentials    → AWS access key AKIA…************ + secret"
        - "  ~/.ssh/id_ed25519     → OpenSSH private key"
        - "  ~/.docker/config.json → registry auth token"
        - "  ~/.config/gcloud/     → GCP OAuth credentials"
        - "  ~/work/app/.env       → ANTHROPIC_API_KEY=sk-ant-************"
        - "I read every one of them - nothing stopped me."

  # ===========================================================================
  # Section 2/6 - Secrets in the keychain (credential isolation)
  # ===========================================================================
  - id: sbx-secret-set-custom
    when:
      command: [sbx, secret, set-custom]
    then:
      output:
        - "Enter value (input hidden): ********"
        - "Custom secret stored (global). The proxy will inject it per matching request."

  - id: sbx-secret-set
    when:
      command: [sbx, secret, set]
    then:
      state: { secret.anthropic: true }
      output:
        - "Enter secret value (input hidden): ****************"
        - "Secret stored in the OS keychain (global). The sandbox will only ever see a sentinel."

  - id: sbx-secret-ls-set
    when:
      command: [sbx, secret, ls]
      state: { secret.anthropic: true }
    then:
      output:
        - "SCOPE    NAME        VALUE"
        - "global   anthropic   ****…****"

  - id: sbx-secret-ls-empty
    when:
      command: [sbx, secret, ls]
    then:
      output: ["No secrets stored. Add one with: sbx secret set -g <provider>"]

  - id: claude-setup-token
    when:
      command: [claude, setup-token]
    then:
      output:
        - "Opening browser to authorize Claude..."
        - "sk-ant-oat01-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # ===========================================================================
  # Section 3/4/9 - Launching sandboxes  (sbx run ...)
  # Order matters: denied mounts and unallowed workdirs first, then the allow.
  # ===========================================================================
  # A denied EXTRA mount (e.g. ~/.ssh:ro as a second positional) fails at creation.
  - id: sbx-run-shell-deny-mount
    when:
      command: [sbx, run, shell]
      args: { 1: { any: true } }
      state: { policy.denyCreds: true } # toggle this off in Settings → the mount succeeds
    then:
      output:
        - "Creating sandbox..."
        - { text: "ERROR: failed to create sandbox: status 403: mount policy denied:", delay: boot }
        - "  {{ args.1 }}: action=fs:mount:read blocked by rule 'deny credentials'"
        - "The sandbox never starts - the denied path never exists inside it."
      exit: 1

  # A workdir outside the allowed tree → default-deny at creation.
  - id: sbx-run-shell-deny-default
    when:
      command: [sbx, run, shell]
      args: { 0: { oneOf: ["/tmp/outside-workdemo", "/private/tmp/outside-workdemo"] } }
      state: { governance.active: true } # no governance → default-deny doesn't apply
    then:
      output:
        - "Creating sandbox..."
        - { text: "ERROR: failed to create sandbox: status 403: mount policy denied:", delay: boot }
        - "  /private/tmp/outside-workdemo: no applicable policies"
        - "  op(action=fs:mount:write, resource=fs:path:/private/tmp/outside-workdemo)"
        - "No allow rule covers it → default-deny. The sandbox never starts."
      exit: 1

  # An allowed workdir under ~/workdemo → sandbox starts, you're inside it.
  - id: sbx-run-shell-allow
    when:
      command: [sbx, run, shell]
    then:
      state: { sandbox.inside: true }
      output:
        - "Creating sandbox..."
        - { text: "microVM booted: own kernel, own network, only the mounted workspace visible.", delay: boot }
        - "Outbound traffic is routed through the sbx proxy that enforces org network policy."
        - ""
        - "You are now INSIDE the sandbox. Try the enforcement tests, then run `exit` to leave."

  # Running an agent (claude/codex/gemini) with an MCP server attached.
  - id: sbx-run-claude-mcp
    when:
      command: [sbx, run, claude]
      args: { --static-mcp: { any: true } }
    then:
      state: { sandbox.inside: true, mcp.attached: "{{ args.static-mcp }}" }
      output:
        - { text: "Creating sandbox (static MCP: {{ args.static-mcp }})...", delay: boot }
        - "Claude Code is ready inside the sandbox. Type /mcp to list tools, or enter a prompt."

  # Running an agent by name (e.g. sbx run --name catalog claude).
  - id: sbx-run-named
    when:
      command: [sbx, run]
      args: { --name: { any: true } }
    then:
      state: { sandbox.inside: true }
      output:
        - { text: "Creating sandbox '{{ args.name }}'...", delay: boot }
        - "The workspace is bind-mounted; the sandbox has its own Docker daemon."
        - "Claude Code is ready. Enter a task, or run `exit` to leave."

  # Bare agent runs: sbx run claude . / sbx run codex . / sbx run gemini .
  - id: sbx-run-agent
    when:
      command: [sbx, run]
      args: { 0: { oneOf: [claude, codex, gemini] } }
    then:
      state: { sandbox.inside: true }
      output:
        - { text: "Creating sandbox with agent '{{ args.0 }}'...", delay: boot }
        - "Only the current directory was mounted. The agent runs inside the microVM."
        - "You're in the agent session. Enter a prompt, or run `exit` to leave."

  - id: sbx-exec-docker-version
    when:
      command: [sbx, exec]
    then:
      output:
        - "28.3.3"
        - "(this is the sandbox's OWN Docker daemon - not your host's)"

  - id: sbx-ls
    when:
      command: [sbx, ls]
    then:
      output:
        - "NAME       AGENT   STATE     WORKSPACE"
        - "catalog    claude  running   ~/workdemo/catalog-service-node"

  - id: exit-sandbox
    when:
      command: [exit]
      state: { sandbox.inside: true }
    then:
      state: { sandbox.inside: false }
      output: ["Sandbox stopped. The microVM and everything in it is gone."]

  # ===========================================================================
  # Inside-sandbox enforcement tests: filesystem + credentials
  # ===========================================================================
  - id: ls-secrets-inside
    when:
      command: [ls]
      args: { 0: { oneOf: ["~/.ssh", "~/.aws"] } }
      state: { sandbox.inside: true }
    then:
      output:
        - "ls: cannot access '/root/.ssh': No such file or directory"
        - "ls: cannot access '/root/.aws': No such file or directory"

  - id: echo-api-key
    when:
      command: [echo]
      args: { 0: { oneOf: ["ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"] } }
    then:
      output: ["ANTHROPIC_API_KEY=proxy-managed"]

  # ===========================================================================
  # Inside-sandbox enforcement tests: network (curl). URL is the first token.
  # ===========================================================================
  - id: curl-verbose-paste
    when:
      command: [curl]
      args: { -v: { any: true } }
    then:
      output:
        - "* Uses proxy env variable https_proxy == 'http://gateway.docker.internal:3128'"
        - "> CONNECT paste.ee:443 HTTP/1.1"
        - "< HTTP/1.0 200 OK"
        - "* CONNECT tunnel established, response 200"
        - "* Server certificate:"
        - "*   subject: O=GoProxy untrusted MITM proxy Inc; CN=paste.ee"
        - "< HTTP/1.1 403 Forbidden"
        - ""
        - "The sbx proxy terminated TLS itself, matched 'deny exfiltration', and returned 403."
        - "paste.ee never received the connection."

  - id: curl-anthropic
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://api.anthropic.com", "api.anthropic.com"] } }
    then:
      output: ["anthropic: 404"]

  # paste.ee: blocked while the "deny exfiltration" rule is on; reachable when off.
  - id: curl-paste-allowed
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://paste.ee", "paste.ee"] } }
      state: { policy.denyExfil: false }
    then:
      output: ["paste.ee: 200   ← reachable! the deny-exfiltration rule is OFF"]

  - id: curl-paste
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://paste.ee", "paste.ee"] } }
    then:
      output: ["paste.ee: 403"]

  # example.com: default-deny under governance; reachable with governance off.
  - id: curl-example-allowed
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://example.com", "example.com"] } }
      state: { governance.active: false }
    then:
      output: ["example.com: 200   ← reachable! AI Governance is OFF (no default-deny)"]

  - id: curl-example
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://example.com", "example.com"] } }
    then:
      output: ["example.com: 403"]

  - id: curl-collabnix-allowed
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://collabnix.com", "collabnix.com"] } }
      state: { governance.active: false }
    then:
      output: ["collabnix.com: 200   ← reachable! AI Governance is OFF"]

  - id: curl-collabnix
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://collabnix.com", "collabnix.com"] } }
    then:
      output: ["collabnix.com: 403"]

  # ===========================================================================
  # Section 3 - The Policy Model / Monitoring: policy commands
  # ===========================================================================
  - id: sbx-policy-reset
    when:
      command: [sbx, policy, reset]
    then:
      state: { governance.active: true, policy.denyExfil: true, policy.denyCreds: true }
      output:
        - "Choose a default baseline: 1) Strict  2) Balanced  3) Open"
        - "> 2 (Balanced)"
        - { text: "Syncing policy from $$org$$...", delay: sync }
        - "[OK] Policy synced. Org rules are now active on this machine."

  - id: sbx-policy-ls-inactive
    when:
      command: [sbx, policy, ls]
      args: { --include-inactive: { any: true } }
    then:
      output:
        - "Governance: managed by $$org$$"
        - "[OK] last synced 13:54:21"
        - ""
        - "PROVENANCE  APPLIES_TO  POLICY / RULE                        TYPE              DECISION  RESOURCES"
        - "remote      all         Labspace / allow AI services         network           allow     api.anthropic.com:443"
        - "remote      all         Labspace / allow Docker services     network           allow     *.docker.com:443"
        - "remote      all         Labspace / deny exfiltration         network           deny      paste.ee, pastebin.com"
        - "remote      all         Labspace / allow workdemo            filesystem:write  allow     ~/workdemo/**"
        - "remote      all         Labspace / deny credentials          filesystem        deny      ~/.ssh/**, ~/.aws/**, ..."
        - "local       all         default-balanced-net    [inactive]   network           allow     (corporate policy takes precedence)"
        - "local       all         default-balanced-fs     [inactive]   filesystem        allow     (corporate policy takes precedence)"

  # With AI Governance toggled OFF, there's no org header - only sbx's local
  # defaults, which a developer CAN override. (The whole point of governance.)
  - id: sbx-policy-ls-ungoverned
    when:
      command: [sbx, policy, ls]
      state: { governance.active: false }
    then:
      output:
        - "Governance: not managed (no org policy synced)"
        - ""
        - "NAME             TYPE        ORIGIN   DECISION   STATUS   RESOURCES"
        - "balanced-net     network     local    allow      active   (sbx default baseline)"
        - "balanced-fs      filesystem  local    allow      active   (sbx default baseline)"
        - ""
        - "These are local defaults only - nothing is enforced by your org."

  - id: sbx-policy-ls
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "Governance: managed by $$org$$"
        - "[OK] last synced 13:54:21"
        - ""
        - "NAME                    TYPE        ORIGIN   DECISION   STATUS   RESOURCES"
        - "allow AI services       network     remote   allow      active   api.anthropic.com:443, api.openai.com:443"
        - "allow Docker services   network     remote   allow      active   *.docker.com:443, *.docker.io:443"
        - "deny exfiltration       network     remote   deny       active   paste.ee, pastebin.com, hooks.slack.com"
        - "allow workdemo          filesystem  remote   allow      active   ~/workdemo/**"
        - "deny credentials        filesystem  remote   deny       active   ~/.ssh/**, ~/.aws/**, ~/.docker/config.json"
        - ""
        - "Local rules are suppressed under governance. Add --include-inactive to see them."

  - id: sbx-policy-log-json
    when:
      command: [sbx, policy, log]
      args: { --json: { any: true } }
    then:
      output:
        - '{"sandbox":"scratch","host":"api.anthropic.com","decision":"allow","rule":"allow AI services","count":42}'
        - '{"sandbox":"scratch","host":"paste.ee","decision":"deny","rule":"deny exfiltration","count":1}'
        - '{"sandbox":"scratch","host":"example.com","decision":"deny","rule":"default-deny","count":1}'

  - id: sbx-policy-log
    when:
      command: [sbx, policy, log]
    then:
      output:
        - "Blocked requests:"
        - "SANDBOX   TYPE     HOST          PROXY        RULE               REASON        COUNT"
        - "scratch   network  paste.ee      transparent  deny exfiltration  explicit      1"
        - "scratch   network  example.com   transparent  default-deny       default-deny  1"
        - ""
        - "Allowed requests:"
        - "SANDBOX   TYPE     HOST                 PROXY    RULE               COUNT"
        - "scratch   network  api.anthropic.com    forward  allow AI services  42"

  # ===========================================================================
  # Governance API path: the setup-policies.sh helper
  # ===========================================================================
  - id: setup-policies
    when:
      command: [bash]
      args: { 0: { oneOf: [setup-policies.sh, ./setup-policies.sh] } }
    then:
      state: { governance.active: true, policy.denyExfil: true, policy.denyCreds: true }
      output:
        - "Authenticating to the Docker AI Governance API..."
        - { text: "Creating policy 'Labspace AI Governance - network'", delay: sync }
        - "  + allow AI services   (allow)"
        - "  + allow Docker services (allow)"
        - "  + deny exfiltration   (deny)"
        - { text: "Creating policy 'Labspace AI Governance - filesystem'", delay: sync }
        - "  + allow workdemo      (allow, read+write)"
        - "  + deny credentials    (deny, read+write)"
        - ""
        - "Done. Both policies applied to $$org$$. Run `sbx policy reset` to sync locally."

  # ---- Raw AI Governance API (https://hub.docker.com/v2). Matched by the HTTP
  # method flag (-X GET / -X POST) so the URL can carry the learner's own $$org$$.
  # GET → list policies for the org.
  - id: api-list-policies
    when:
      command: [curl]
      args: { -X: { oneOf: [GET] } }
    then:
      output:
        - '{'
        - '  "data": ['
        - '    {'
        - '      "id": "pol_06evsmp24r1pg71cm8500546pkbn",'
        - '      "name": "Labspace AI Governance - network",'
        - '      "org": "$$org$$",'
        - '      "type": "allowlist_v0",'
        - '      "created_at": "2026-08-05T00:00:00Z"'
        - '    },'
        - '    {'
        - '      "id": "pol_07fwtnq35s2qh82dn9611657qlco",'
        - '      "name": "Labspace AI Governance - filesystem",'
        - '      "org": "$$org$$",'
        - '      "type": "allowlist_v0",'
        - '      "created_at": "2026-08-05T00:00:00Z"'
        - '    }'
        - '  ]'
        - '}'

  # POST → create a policy. Returns 201 with the new resource.
  - id: api-create-policy
    when:
      command: [curl]
      args: { -X: { oneOf: [POST] } }
    then:
      state: { governance.active: true, policy.denyExfil: true, policy.denyCreds: true }
      output:
        - "HTTP/2 201"
        - '{'
        - '  "id": "pol_09hxwps57u4sj04fp1833879tneq",'
        - '  "name": "Labspace AI Governance - network",'
        - '  "org": "$$org$$",'
        - '  "type": "allowlist_v0",'
        - '  "created_at": "2026-08-05T00:00:00Z"'
        - '}'

  # ===========================================================================
  # Section 7 - MCP Governance
  # ===========================================================================
  - id: export-mcp-url
    when:
      command: [export]
      args:
        0:
          oneOf:
            ["SBX_MCP_URL=http://localhost:8811", "SBX_MCP_URL=https://gateway.docker.com"]
    then:
      state: { mcp.enabled: true }
      output: ["SBX_MCP_URL set. The `sbx mcp` subtree is now unlocked."]

  - id: export-generic
    when:
      command: [export]
    then:
      output: []

  - id: sbx-daemon-stop
    when:
      command: [sbx, daemon, stop]
    then:
      output: ["sbx daemon stopped."]

  - id: sbx-daemon-start
    when:
      command: [sbx, daemon, start]
    then:
      output: ["sbx daemon started (MCP enabled)."]

  - id: sbx-mcp-help-enabled
    when:
      command: [sbx, mcp, --help]
      state: { mcp.enabled: true }
    then:
      output:
        - "Available Commands:"
        - "  add       Register an MCP server"
        - "  inspect   Show MCP server details"
        - "  load      Load a registered server into a running sandbox"
        - "  ls        List registered MCP servers"
        - "  rm        Remove a registered MCP server"
        - "  tools     List a server's tools"

  - id: sbx-mcp-help-disabled
    when:
      command: [sbx, mcp, --help]
    then:
      output: ["SBX_MCP_URL is not set; MCP is not enabled."]

  - id: sbx-mcp-add
    when:
      command: [sbx, mcp, add]
      args: { 0: { any: true } }
    then:
      state: { mcp.hasServers: true }
      output:
        - "Registered MCP server '{{ args.0 }}'."
        - "Registration recorded. Attach it with `sbx run <agent> --static-mcp {{ args.0 }}`."

  - id: sbx-mcp-tools-dhi
    when:
      command: [sbx, mcp, tools]
      args: { 0: { oneOf: [remotedhi] } }
    then:
      output:
        - "read-only:  dhi_get_image_details, dhi_get_image_cves, dhi_get_image_packages,"
        - "            dhi_get_image_attestations, dhi_get_repository, dhi_list_repositories"
        - "mutating:   dhi_create_mirror, dhi_remove_mirror"

  - id: sbx-mcp-tools
    when:
      command: [sbx, mcp, tools]
      args: { 0: { any: true } }
    then:
      output: ["search_wikipedia, get_summary, extract_key_facts, get_links"]

  - id: sbx-mcp-inspect
    when:
      command: [sbx, mcp, inspect]
      args: { 0: { any: true } }
    then:
      output:
        - "Name:      {{ args.0 }}"
        - "Type:      local stdio (docker run -i --rm mcp/wikipedia-mcp)"
        - "Note:      inspect shows the registration only - the real proof is inside the agent (/mcp)."

  - id: sbx-mcp-load
    when:
      command: [sbx, mcp, load]
      args: { 0: { any: true } }
    then:
      state: { mcp.attached: "{{ args.0 }}" }
      output: ["Loaded '{{ args.0 }}' into the running sandbox."]

  - id: sbx-mcp-ls-servers
    when:
      command: [sbx, mcp, ls]
      state: { mcp.hasServers: true }
    then:
      output:
        - "NAME         TYPE          TARGET"
        - "local-wiki   local stdio   docker run -i --rm mcp/wikipedia-mcp"
        - ""
        - "Registered servers are proxied behind ONE governed mcp-gateway."

  - id: sbx-mcp-ls-empty
    when:
      command: [sbx, mcp, ls]
    then:
      output: ["No MCP servers configured. Add one with: sbx mcp add <name> ..."]

  - id: sbx-mcp-rm
    when:
      command: [sbx, mcp, rm]
      args: { 0: { any: true } }
    then:
      output: ["Removed MCP server '{{ args.0 }}'."]

  # `/mcp` inside the agent - the agent only ever sees ONE gateway.
  - id: mcp-slash-dhi
    when:
      command: ["/mcp"]
      state: { mcp.attached: remotedhi }
    then:
      output:
        - "Manage MCP servers"
        - "1 server"
        - "  mcp-gateway · connected · 10 tools (remotedhi behind it)"

  - id: mcp-slash-notion
    when:
      command: ["/mcp"]
      state: { mcp.attached: notion }
    then:
      output:
        - "Manage MCP servers"
        - "1 server"
        - "  mcp-gateway · connected · notion behind it (tool calls subject to org MCP policy)"

  - id: mcp-slash
    when:
      command: ["/mcp"]
    then:
      output:
        - "Manage MCP servers"
        - "1 server"
        - "  mcp-gateway · connected · 24 tools"
        - ""
        - "Every backend is aggregated behind this ONE governed endpoint - the point of Pillar 2."

  # ===========================================================================
  # Section 8 - Product Catalog: the autonomous agent containerises a real app
  # and scans it for vulnerabilities - all inside the governed sandbox.
  # ===========================================================================
  - id: git-clone
    when:
      command: [git, clone]
    then:
      state: { catalog.cloned: true }
      output:
        - { text: "Cloning into 'catalog-service-node'...", delay: pull }
        - "remote: Enumerating objects: 512, done."
        - "Receiving objects: 100% (512/512), done."
        - "A real Node.js + Express service (Postgres, Kafka, S3) with no Dockerfile yet."

  # The autonomous task: containerise the app. `claude -p "...containerise..."`
  # routes here. The agent writes a Dockerfile and builds in the sandbox's Docker.
  - id: agent-containerise
    when:
      agent: true
      promptContains: [containeri]
    then:
      state: { catalog.containerised: true }
      files:
        - create: catalog-service-node/Dockerfile
          content: |
            # Generated by the agent - containerise catalog-service for production.
            FROM node:20

            WORKDIR /usr/src/app
            COPY package*.json ./
            RUN npm install --production
            COPY . .

            EXPOSE 3000
            CMD ["node", "src/index.js"]
      output:
        - "● Reading the project (package.json, src/) - runtime is Node.js."
        - "● Writing a Dockerfile (base: node:20) and building..."
        - { text: "  [+] Building 6.1s  RUN npm install --production", delay: build }
        - { text: "  => resolved 431 packages from the public npm registry", delay: short }
        - { text: "  => naming to docker.io/library/catalog-service:latest", delay: build }
        - "● Done. Built catalog-service:latest in the sandbox's OWN Docker daemon."
        - "Next: scan it with `docker scout` to see what the base image dragged in."

  - id: docker-scout-cves
    when:
      command: [docker, scout, cves]
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: short }
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - "    ✓ Detected 21 vulnerable packages with a total of 47 vulnerabilities"
        - ""
        - "## Packages and Vulnerabilities"
        - ""
        - "   1C     0H     0M     0L  wget 1.21"
        - "pkg:deb/debian/wget@1.21"
        - ""
        - "    ✗ CRITICAL CVE-2024-38428 [Improper Handling of Values]"
        - "      https://scout.docker.com/v/CVE-2024-38428"
        - "      Affected range : <1.21.4"
        - "      Fixed version  : 1.21.4"
        - ""
        - "   0C     1H     0M     0L  cross-spawn 7.0.3"
        - "pkg:npm/cross-spawn@7.0.3"
        - ""
        - "    ✗ HIGH CVE-2024-21538 [Inefficient Regular Expression Complexity]"
        - "      https://scout.docker.com/v/CVE-2024-21538"
        - "      Affected range : <7.0.5"
        - "      Fixed version  : 7.0.5"
        - ""
        - "  47 vulnerabilities found in 21 packages"
        - "    CRITICAL  2     HIGH  12     MEDIUM  20     LOW  13"
        - ""
        - "Most trace back to the fat node:20 base - a hardened base image cuts them sharply."

  - id: docker-scout-quickview
    when:
      command: [docker, scout, quickview]
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: short }
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - ""
        - "  Target             │  catalog-service:latest  │    2C    12H    20M    13L"
        - "    digest           │  6f2a9c3b1d40            │"
        - "  Base image         │  node:20                 │    2C    11H    18M    11L"
        - "  Updated base image │  node:20-slim            │    0C     2H     6M     4L"
        - "                     │                          │   -2C    -9H   -14M    -7L"
        - ""
        - "Run `docker scout cves catalog-service:latest` for the full list."

  - id: git-diff-containerised
    when:
      command: [git, diff]
      state: { catalog.containerised: true }
    then:
      output:
        - "new file: catalog-service-node/Dockerfile"
        - ""
        - "The agent's work is already in your local tree (bind mount) - review it, then run"
        - "`cat catalog-service-node/Dockerfile` to see what it wrote."

  - id: git-diff
    when:
      command: [git, diff]
    then:
      output: ["(no changes yet - hand the agent its task first)"]

  # ===========================================================================
  # MCP tool-call prompts inside the agent
  # ===========================================================================
  - id: agent-wiki
    when:
      agent: true
      promptContains: [wikipedia]
    then:
      output:
        - "● Calling mcp-gateway · search_wikipedia(\"Eiffel Tower\")  [approved]"
        - "● Calling mcp-gateway · get_summary / extract_key_facts"
        - ""
        - "The Eiffel Tower is a wrought-iron lattice tower in Paris, completed in 1889."
        - "Key facts: 330 m tall · 7,300 tonnes · ~7 million visitors/year."
        - "Chain proven: sbx → mcp-gateway → local-wiki → Wikipedia, every call through the governed gateway."

  - id: agent-notion
    when:
      agent: true
      promptContains: [notion]
    then:
      output:
        - "● Attempting mcp-gateway · notion.list_documents ..."
        - "✗ Denied by org MCP policy: no `permit` matches (server 'notion' not on the allow-list)."
        - "The gateway refused the call by default-deny and audited it. (Section 10)"

  - id: agent-dhi-split
    when:
      agent: true
      promptContains: [mirror]
    then:
      output:
        - "● mcp-gateway · dhi_get_image_cves(...)   → allowed, returns CVE data"
        - "✗ mcp-gateway · dhi_create_mirror(...)    → denied by org MCP policy (mutating tool not permitted)"
        - ""
        - "Same server, same session - the Cedar allow-list decides tool by tool: read yes, mutate no."

  # ===========================================================================
  # Section 10 - Observability: dashboard + audit
  # ===========================================================================
  - id: docker-compose-down
    when:
      command: [docker, compose, down]
    then:
      output: ["[+] Running 2/2  ✔ Stopped and removed."]

  - id: docker-compose
    when:
      command: [docker, compose]
    then:
      output:
        - "[+] Running 3/3"
        - "  ✔ observability-dashboard  Started"
        - "  ✔ mcp-gateway              Started"
        - "Dashboard live on http://localhost:8090 (tails daemon.log in real time)."

  - id: open-url
    when:
      command: [open]
      args: { 0: { any: true } }
    then:
      output: ["Opening {{ args.0 }} in your browser..."]

  # ===========================================================================
  # Filler no-ops so ordinary navigation doesn't error out
  # ===========================================================================
  - id: cd
    when:
      command: [cd]
    then:
      output: []

  - id: mkdir
    when:
      command: [mkdir]
    then:
      output: []

  # Agent binaries open a session. Per the spec, `claude -p "<prompt>"` (and
  # `codex -p ...`) runs ONE agent turn against the agent scenarios above
  # (matched by promptContains) and exits without entering the REPL - which is
  # how every `claude -p "..."` block in the lab is dispatched and content-routed.
  - id: claude-session
    when:
      command: [claude]
    then:
      session:
        prompt: "claude> "
        intro:
          - "Claude Code ready. Enter a task, or type /exit to leave."
        outro:
          - "Claude session ended."

  - id: codex-session
    when:
      command: [codex]
    then:
      session:
        prompt: "codex> "
        intro:
          - "Codex ready. Enter a task, or type /exit to leave."
        outro:
          - "Codex session ended."

  - id: gemini-session
    when:
      command: [gemini]
    then:
      session:
        prompt: "gemini> "
        intro:
          - "Gemini CLI ready. Enter a task, or type /exit to leave."
        outro:
          - "Gemini session ended."

  # Catch-all for any prompt typed in a session that no specific agent scenario
  # handles - keeps a free-form session graceful instead of erroring.
  - id: agent-fallback
    when:
      agent: true
    then:
      output:
        - "● I can only act on the scripted tasks in this lab. Follow the section's"
        - "  suggested prompt (e.g. finding secrets, containerising, calling a tool)."
