  # ===========================================================================
  # Section 8 - Product Catalog: the autonomous agent containerises a real app
  # and scans it for vulnerabilities - all inside the governed sandbox.
  # ===========================================================================
  - id: git-clone
    when:
      command: [git, clone]
    then:
      state: { catalog.cloned: true }
      # Materialise the repo on clone (not just via the seed) so the files exist
      # even for a returning learner whose saved filesystem predates them. This
      # mirrors the real ajeetraina/product-catalog-demo-showcase layout: an
      # Express + Postgres/Kafka/S3 backend under src/, a React (Vite) frontend
      # under dev/webapp/, DB schema and dev tooling under dev/ - and crucially
      # NO Dockerfile or Compose. The agent adds the Dockerfile later in the lab.
      files:
        - create: product-catalog-demo-showcase/package.json
          content: |
            {
              "name": "container-supported-development",
              "version": "1.0.0",
              "scripts": {
                "start": "node src/index.js",
                "dev": "nodemon --inspect src/index.js --ignore dev",
                "dev-container": "nodemon src/index.js",
                "test": "env-cmd --file .env.node -- jest --detectOpenHandles"
              },
              "dependencies": {
                "@aws-sdk/client-s3": "^3.1030.0",
                "dotenv": "^17.4.2",
                "express": "^5.2.1",
                "kafkajs": "^2.2.4",
                "multer": "^2.1.1",
                "node-fetch": "^2",
                "pg": "^8.20.0"
              },
              "devDependencies": {
                "@testcontainers/kafka": "^11.14.0",
                "@testcontainers/localstack": "^11.14.0",
                "@testcontainers/postgresql": "^11.14.0",
                "jest": "^29.7.0",
                "nodemon": "^3.1.4",
                "testcontainers": "^11.14.0"
              },
              "packageManager": "yarn@1.22.21"
            }
        - create: product-catalog-demo-showcase/src/index.js
          content: |
            require("dotenv").config();
            const os = require("os");
            const express = require("express");
            const ProductService = require("./services/ProductService");
            const multer = require("multer");

            const app = express();
            app.use(express.json());
            const upload = multer({ dest: os.tmpdir() });

            app.get("/", (req, res) => res.send("Hello World!!!"));

            app.get("/api/products", async (req, res) => {
              res.json(await ProductService.getProducts());
            });

            app.post("/api/products", async (req, res) => {
              try {
                const newProduct = await ProductService.createProduct(req.body);
                res
                  .status(201)
                  .header("Location", `/api/products/${newProduct.id}`)
                  .json(newProduct);
              } catch (error) {
                res.status(400).json({ error: error.message });
              }
            });

            app.listen(3000, () => console.log("Listening on port 3000"));
        - create: product-catalog-demo-showcase/src/services/ProductService.js
          content: |
            const { Pool } = require("pg");
            const PublisherService = require("./PublisherService");
            const StorageService = require("./StorageService");

            const pool = new Pool({
              host: process.env.POSTGRES_HOST,
              database: process.env.POSTGRES_DB,
            });

            async function getProducts() {
              const { rows } = await pool.query("SELECT * FROM products ORDER BY id");
              return rows;
            }

            async function createProduct(product) {
              const { rows } = await pool.query(
                "INSERT INTO products (name, upc, price) VALUES ($1, $2, $3) RETURNING *",
                [product.name, product.upc, product.price],
              );
              await PublisherService.publishEvent("products", rows[0]);
              return rows[0];
            }

            module.exports = { getProducts, createProduct };
        - create: product-catalog-demo-showcase/src/services/PublisherService.js
          content: |
            const { Kafka } = require("kafkajs");

            const kafka = new Kafka({ brokers: [process.env.KAFKA_BROKER] });
            const producer = kafka.producer();

            async function publishEvent(topic, message) {
              await producer.connect();
              await producer.send({ topic, messages: [{ value: JSON.stringify(message) }] });
            }

            module.exports = { publishEvent };
        - create: product-catalog-demo-showcase/src/services/InventoryService.js
          content: |
            const fetch = require("node-fetch");

            async function getStockLevel(upc) {
              const res = await fetch(`${process.env.INVENTORY_BASE_URL}/api/${upc}`);
              return res.json();
            }

            module.exports = { getStockLevel };
        - create: product-catalog-demo-showcase/src/services/StorageService.js
          content: |
            const { S3Client, PutObjectCommand } = require("@aws-sdk/client-s3");

            const client = new S3Client({ endpoint: process.env.AWS_ENDPOINT_URL });

            async function uploadFile(key, body) {
              await client.send(
                new PutObjectCommand({ Bucket: process.env.S3_BUCKET, Key: key, Body: body }),
              );
            }

            module.exports = { uploadFile };
        - create: product-catalog-demo-showcase/dev/db/1-create-schema.sql
          content: |
            CREATE TABLE products (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              description TEXT,
              upc VARCHAR(12) NOT NULL UNIQUE,
              price DECIMAL(10, 2) NOT NULL,
              has_image BOOLEAN NOT NULL DEFAULT FALSE
            );
        - create: product-catalog-demo-showcase/dev/webapp/package.json
          content: |
            {
              "name": "webapp",
              "private": true,
              "version": "0.0.0",
              "type": "module",
              "scripts": {
                "dev": "yarn install && vite --host 0.0.0.0",
                "build": "vite build",
                "preview": "vite preview"
              },
              "dependencies": {
                "react": "^18.3.1",
                "react-dom": "^18.3.1"
              },
              "devDependencies": {
                "@vitejs/plugin-react": "^4.3.4",
                "vite": "^6.0.1"
              }
            }
        - create: product-catalog-demo-showcase/dev/webapp/src/App.jsx
          content: |
            import { useEffect, useState } from "react";
            import ProductRow from "./ProductRow";

            export default function App() {
              const [products, setProducts] = useState([]);

              useEffect(() => {
                fetch("/api/products")
                  .then((r) => r.json())
                  .then(setProducts);
              }, []);

              return (
                <main>
                  <h1>Product Catalog</h1>
                  <table>
                    <tbody>
                      {products.map((p) => (
                        <ProductRow key={p.id} product={p} />
                      ))}
                    </tbody>
                  </table>
                </main>
              );
            }
        - create: product-catalog-demo-showcase/gha.env
          content: |
            POSTGRES_HOST=localhost
            POSTGRES_DB=catalog
            KAFKA_BROKER=localhost:9092
            INVENTORY_BASE_URL=http://localhost:8080
        - create: product-catalog-demo-showcase/README.md
          content: |
            # Product Catalog demo showcase

            An Express + Postgres product-catalog API (with Kafka events and S3
            image storage) plus a React/Vite web app under `dev/webapp/`. Local dev
            is driven with `yarn dev`.

            > No Dockerfile or Compose file - this repo ships source only. The
            > container image is built by the agent in this lab.
      output:
        - { text: "Cloning into 'product-catalog-demo-showcase'...", delay: pull }
        - "remote: Enumerating objects: 512, done."
        - "remote: Counting objects: 100% (512/512), done."
        - { text: "Receiving objects: 100% (512/512), 1.42 MiB | 4.10 MiB/s, done.", delay: short }
        - "Resolving deltas: 100% (198/198), done."
        - "A real Node.js + Express service (Postgres, Kafka, S3) with no Dockerfile yet."

  # The autonomous task: containerise the app. `claude -p "...containerise..."`
  # routes here. The agent writes a Dockerfile and builds in the sandbox's Docker.
  - id: agent-containerise
    when:
      agent: true
      promptContains: [containeri]
    then:
      state: { catalog.containerised: true }
      files:
        - create: product-catalog-demo-showcase/Dockerfile
          content: |
            # Generated by the agent - containerise product-catalog for production.
            FROM node:20

            WORKDIR /usr/src/app
            COPY package*.json ./
            RUN npm install --production
            COPY . .

            EXPOSE 3000
            CMD ["node", "src/index.js"]
        - create: product-catalog-demo-showcase/compose.yaml
          content: |
            # Generated by the agent - local orchestration for product-catalog.
            services:
              app:
                build: .
                ports:
                  - "3000:3000"
                environment:
                  POSTGRES_HOST: db
                  POSTGRES_DB: catalog
                  KAFKA_BROKER: kafka:9092
                depends_on:
                  - db
                  - kafka
              db:
                image: postgres:16
                environment:
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: catalog
                volumes:
                  - ./dev/db:/docker-entrypoint-initdb.d
              kafka:
                image: apache/kafka:3.7.0
      output:
        - "● Reading the project (package.json, src/) - runtime is Node.js."
        - "● Writing a Dockerfile (base: node:20) and a compose.yaml, then building..."
        - { text: "  [+] Building 6.1s  RUN npm install --production", delay: build }
        - { text: "  => resolved 431 packages from the public npm registry", delay: short }
        - { text: "  => naming to docker.io/library/product-catalog:latest", delay: build }
        - "● Done. Wrote Dockerfile + compose.yaml and built product-catalog:latest in the sandbox's OWN Docker daemon."
        - "Next: scan it with `docker scout` to see what the base image dragged in."

  # Remediation: the agent switches the base to a Docker Hardened Image and rebuilds.
  - id: agent-harden
    when:
      agent: true
      promptContains: [hardened]
    then:
      state: { catalog.hardened: true }
      files:
        - create: product-catalog-demo-showcase/Dockerfile
          content: |
            # Rewritten by the agent - hardened, minimal base (Docker Hardened Image).
            FROM dhi.io/node:20-hardened

            WORKDIR /usr/src/app
            COPY package*.json ./
            RUN npm install --production
            COPY . .

            EXPOSE 3000
            CMD ["node", "src/index.js"]
      output:
        - "● Swapping FROM node:20  →  FROM dhi.io/node:20-hardened (minimal, signed)."
        - "● Rebuilding product-catalog:latest on the hardened base..."
        - { text: "  [+] Building 5.4s  RUN npm install --production", delay: build }
        - { text: "  => naming to docker.io/library/product-catalog:latest", delay: build }
        - "● Done. Re-run `docker scout cves` - the CVE count collapses."

  # Hardened image → almost nothing left to find.
  - id: docker-scout-cves-hardened
    when:
      command: [docker, scout, cves]
      state: { catalog.hardened: true }
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: short }
        - { text: "    ✓ Indexed 96 packages", delay: scan }
        - "    ✓ Detected 2 vulnerable packages with a total of 2 vulnerabilities"
        - ""
        - "  2 vulnerabilities found in 2 packages"
        - "    CRITICAL  0     HIGH  0     MEDIUM  1     LOW  1"
        - ""
        - "The critical/high findings are gone - the hardened base ships only what the"
        - "app needs and is patched upstream. Same app, a fraction of the attack surface."

  - id: docker-scout-cves
    when:
      command: [docker, scout, cves]
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: short }
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - "    ✓ Detected 21 vulnerable packages with a total of 47 vulnerabilities"
        - ""
        - "## Packages and Vulnerabilities"
        - ""
        - "   1C     0H     0M     0L  wget 1.21"
        - "pkg:deb/debian/wget@1.21"
        - ""
        - "    ✗ CRITICAL CVE-2024-38428 [Improper Handling of Values]"
        - "      https://scout.docker.com/v/CVE-2024-38428"
        - "      Affected range : <1.21.4"
        - "      Fixed version  : 1.21.4"
        - ""
        - "   0C     1H     0M     0L  cross-spawn 7.0.3"
        - "pkg:npm/cross-spawn@7.0.3"
        - ""
        - "    ✗ HIGH CVE-2024-21538 [Inefficient Regular Expression Complexity]"
        - "      https://scout.docker.com/v/CVE-2024-21538"
        - "      Affected range : <7.0.5"
        - "      Fixed version  : 7.0.5"
        - ""
        - "  47 vulnerabilities found in 21 packages"
        - "    CRITICAL  2     HIGH  12     MEDIUM  20     LOW  13"
        - ""
        - "Most trace back to the fat node:20 base - a hardened base image cuts them sharply."

  - id: docker-scout-quickview
    when:
      command: [docker, scout, quickview]
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: short }
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - ""
        - "  Target             │  product-catalog:latest   │    2C    12H    20M    13L"
        - "    digest           │  6f2a9c3b1d40             │"
        - "  Base image         │  node:20                  │    2C    11H    18M    11L"
        - "  Recommended base   │  dhi.io/node:20-hardened  │    0C     0H     1M     1L"
        - "                     │                           │   -2C   -11H   -17M   -10L"
        - ""
        - "A Docker Hardened Image would remove nearly every finding. See the Hardened"
        - "Images section. Run `docker scout cves product-catalog:latest` for the full list."

  - id: git-diff-containerised
    when:
