title: "Docker AI Governance"
description: >
  Define once, enforce everywhere. A hands-on, fully simulated lab that proves how
  Docker AI Governance policies flow from the Admin Console to every developer's
  sandbox - stopping a rogue agent's network, filesystem, credential, and MCP
  attacks with one policy engine. Nothing to install; it runs the same for everyone.

# Optional catalog card. Only shown on the landing page when this repo has two or
# more labs. labs.json is GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: shield_lock
  tags: ["ai governance", "security", "sandbox", "mcp"]
  estimatedMinutes: 60

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# One terminal - the developer's host shell, with `sbx` ready to use.
terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the virtual filesystem. Built-in `ls`/`cat` reflect these immediately;
# scenarios and save-as blocks add more on top.
files:
  README.md: |
    # Docker AI Governance - lab workspace

    This is your host home directory in the simulated lab. Everything the
    terminal does here is scripted - no real Docker, sbx daemon, or network -
    so every learner sees the same allow/deny decisions.

    Files you'll meet:
      workdemo/                        the one directory sandboxes are allowed to mount
      catalog-service-node/            a real Node.js app the agent containerises (Section 8)
  catalog-service-node/package.json: |
    {
      "name": "catalog-service-node",
      "version": "1.0.0",
      "description": "Product Catalog REST API over Postgres, with Kafka and S3",
      "main": "src/index.js",
      "scripts": { "start": "node src/index.js" },
      "dependencies": {
        "express": "^4.19.2",
        "pg": "^8.11.5",
        "kafkajs": "^2.2.4",
        "@aws-sdk/client-s3": "^3.588.0"
      }
    }
  catalog-service-node/src/index.js: |
    const express = require("express");
    const products = require("./routes/products");

    const app = express();
    app.use(express.json());
    app.use("/api/products", products);

    app.listen(3000, () => console.log("catalog-service listening on :3000"));

# Ordered instruction pages (markdown), rendered in the left-hand panel.
sections:
  - title: Why AI Governance
    contentPath: 00-introduction.md
  - title: "Product Catalog: An Agent Containerises It"
    contentPath: 01-product-catalog.md
  - title: The Policy Model
    contentPath: 02-policy-model.md
  - title: Network Enforcement
    contentPath: 03-network-demo.md
  - title: Filesystem Isolation
    contentPath: 04-filesystem-isolation.md
  - title: Credential Isolation
    contentPath: 05-credential-isolation.md
  - title: Hardened Images (DHI)
    contentPath: 06-hardened-images.md
  - title: MCP Governance
    contentPath: 07-mcp.md
  - title: Putting It All Together
    contentPath: 08-capstone.md
  - title: Observability & Audit
    contentPath: 09-observability.md

# $$name$$ in markdown is replaced with these values. `org` is overridden by the
# :variableDefinition prompt in "Why AI Governance".
variables:
  org: your-org
