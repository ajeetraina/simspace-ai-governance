title: "My Lab"
description: "A starter Simspace lab — edit these files, preview locally, and push to deploy."

# Optional catalog card metadata. It's only shown on the landing page when this
# repo has two or more labs (a single lab is entered directly). labs.json is
# GENERATED from this block — you never write or edit labs.json by hand.
catalog:
  icon: school
  tags: ["getting started"]

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# One terminal tab. Add more (each with a unique id) for multi-shell labs.
terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the virtual filesystem. Built-in `ls`/`cat` reflect these immediately.
files:
  README.txt: |
    Welcome to your lab's virtual filesystem.
    Files created by scenarios and save-as blocks appear here too.

# Ordered instruction pages (markdown), rendered in the left-hand panel.
sections:
  - title: Introduction
    contentPath: 00-intro.md

# $$name$$ in markdown is replaced with these values at render time.
variables:
  name: world
