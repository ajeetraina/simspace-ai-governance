# The company-standard "Docker AI Governance" workshop deck (the approved
# MasterCopy PDF), presented in Simspace as full-bleed slides. Every page is a
# full-bleed image so the branding/content matches the master exactly; at the
# hands-on sections we splice in LIVE terminal demo slides that reuse the sibling
# `ai-governance` lab's simulator (see spec/slidedeck.md in dockersamples/simspace).
kind: slides
title: "Docker AI Governance - Slides"
description: "The company AI Governance workshop deck, with live scripted demos spliced into the hands-on sections. Start here, then do the lab."

# Landing-page card. `order: 1` puts the deck ahead of the lab, so it reads as
# "watch the workshop, then do the lab". labs.json is GENERATED from this block.
catalog:
  icon: slideshow
  order: 1
  tags: ["ai governance", "slides", "start here"]
  estimatedMinutes: 90

version: "2.0.0"

# Dark is the deck's default surface - it matches the company deck's deep-blue
# slides, so the native live-demo slides sit seamlessly among the image slides.
theme: dark

# Reuse the SIBLING LAB's simulator so the spliced-in demos run the exact scripted
# commands the learners run in the lab - the two can't drift apart. State is NOT
# shared: this deck gets its own fresh machine (spec/slidedeck.md §7.2).
simulator: ../ai-governance/simulator.yaml

# One demo terminal. The lab's scenarios aren't terminal-scoped, so any id fires
# them; `demo` is the conventional deck id referenced by `::terminal{id=demo}`.
terminals:
  - id: demo
    title: Demo
    icon: terminal

# `slides:` is the deck alias for `sections:`. One chapter holds the whole deck;
# slides within it are split on lines of exactly `---`. Each company page is a
# full-bleed <img>; six live-demo slides are interleaved at the hands-on sections.
slides:
  - title: Workshop
    contentPath: deck.md

# $$org$$ substitution in slide markdown.
variables:
  org: your-org
